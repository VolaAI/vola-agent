[package]
name = "vola-agent"
version = "0.1.0"
edition = "2021"
description = "Agent client: CLI tools, skills, SQLite short-term memory"
license = "MIT"

[[bin]]
name = "vola-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json", "native-certs"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 2
strip = true
