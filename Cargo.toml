[workspace]
members = [".", "vola-core", "vola-tui"]
exclude = ["vola-gui"]
resolver = "2"

[package]
name = "vola-agent"
version = "0.1.0"
edition = "2021"
description = "Agent client: CLI tools, skills, SQLite short-term memory"
license = "MIT"

[[bin]]
name = "vola-agent"
path = "src/main.rs"

[dependencies]
vola-tui = { path = "vola-tui" }

[profile.release]
opt-level = 2
strip = true
