[workspace]
members = [".", "vola-core"]
exclude = ["vola-gui"]
resolver = "2"

[package]
name = "vola-agent"
version = "0.1.0"
edition = "2021"
description = "Agent client: CLI tools, skills, SQLite short-term memory"
license = "MIT"

[[bin]]
name = "vola-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
vola-core = { path = "vola-core" }

[profile.release]
opt-level = 2
strip = true
