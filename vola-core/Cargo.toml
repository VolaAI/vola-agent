[package]
name = "vola-core"
version = "0.1.0"
edition = "2021"
description = "Core engine: LLM clients, SQLite memory, skills, tools and the WebSocket API"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
ctrlc = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2.12", features = ["json", "native-certs"] }
